name: 🤖 Claude Auto-Fix (Issue Creation)

on:
  workflow_run:
    workflows: ["🚀 CI/CD Pipeline with Claude Self-Healing"]
    types: [completed]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  open-fix-issue:
    name: 🚨 Create Claude Fix Issue
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🏷️ Ensure required labels exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Create priority-high label if it doesn't exist
          if ! gh label list --limit 500 | grep -q '^priority-high'; then
            gh label create priority-high \
              --description "CI failures needing Claude auto-fix" \
              --color FF6F00
            echo "✅ Created priority-high label"
          else
            echo "✅ priority-high label already exists"
          fi
          
          # Create claude-fix label if it doesn't exist
          if ! gh label list --limit 500 | grep -q '^claude-fix'; then
            gh label create claude-fix \
              --description "Issues being handled by Claude auto-fix" \
              --color 7B68EE
            echo "✅ Created claude-fix label"
          else
            echo "✅ claude-fix label already exists"
          fi
          
          # Create ci-failure label if it doesn't exist
          if ! gh label list --limit 500 | grep -q '^ci-failure'; then
            gh label create ci-failure \
              --description "CI/CD pipeline failures" \
              --color DC143C
            echo "✅ Created ci-failure label"
          else
            echo "✅ ci-failure label already exists"
          fi

      - name: 🚨 Post failure summary as issue
        id: create_issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get workflow run details
          WORKFLOW_ID="${{ github.event.workflow_run.id }}"
          COMMIT_SHA="${{ github.event.workflow_run.head_sha }}"
          BRANCH_NAME="${{ github.event.workflow_run.head_branch }}"
          
          # Create comprehensive issue for Claude
          ISSUE_URL=$(gh issue create \
            --title "🤖 CI Failed - Auto-Fix Required (Run #${{ github.event.workflow_run.run_number }})" \
            --body "## 🚨 CI/CD Pipeline Failure - Claude Auto-Fix Request

          **Workflow Run:** ${{ github.event.workflow_run.html_url }}
          **Commit:** ${COMMIT_SHA}
          **Branch:** ${BRANCH_NAME}
          **Run Number:** ${{ github.event.workflow_run.run_number }}
          **Attempt:** ${{ github.event.workflow_run.run_attempt }}

          ## 🎯 Context
          This is the **Customs Broker Portal** project - a reference and research portal providing synthesized insights for customs brokers. It's a live library for import/export regulations, tariff research, duty calculations, and regulatory reference that requires fixes while maintaining data accuracy and calculation integrity.

          ## 📋 Reference Documentation
          Please review these files for business context and constraints:
          - [\`.github/claude-ux-context.md\`](.github/claude-ux-context.md) - UX guidelines and user flows
          - [\`.github/claude-business-rules.md\`](.github/claude-business-rules.md) - Business logic and workflow rules
          - [\`.github/claude-api-contracts.md\`](.github/claude-api-contracts.md) - API specifications
          - [\`.github/claude-constraints.md\`](.github/claude-constraints.md) - Critical constraints
          - [\`.github/claude-config.yml\`](.github/claude-config.yml) - Master configuration

          ## 🔧 Expected Fixes
          Based on the failure, please fix:

          ### Frontend TypeScript Issues (Quality Gate ①)
          - Missing imports and type definitions
          - Property name mismatches with type definitions
          - Interface and type errors
          - React component prop type issues
          - Ensure \`npx tsc -b\` passes with zero errors
          - Ensure \`npm run lint\` passes with zero warnings

          ### Backend Python Issues (Quality Gate ②)
          - Python code formatting (\`black --check .\`)
          - Import sorting (\`isort --check-only .\`)
          - Type checking (\`mypy . --ignore-missing-imports\`)
          - Test failures (\`pytest -v --cov=. --cov-report=term-missing\`)
          - FastAPI route and model issues
          - SQLAlchemy ORM and database issues
          - Maintain test coverage requirements

          ### Frontend Test Issues (Quality Gate ③)
          - Unit test failures in React components
          - Jest configuration issues
          - Testing Library setup problems
          - Mock setup for API calls
          - Ensure \`npm run test:ci\` passes completely

          ### E2E Test Issues (Quality Gate ④)
          - End-to-end test failures
          - Playwright configuration issues
          - Timing and selector issues
          - API integration problems
          - Ensure \`npm run test:e2e\` passes

          ## 🏢 Business Context - Customs Broker Portal
          This reference portal provides:
          - **Tariff Research** - Schedule 3 import tariffs and export classifications
          - **Duty Calculations** - Comprehensive calculators for all duties, taxes, and concessions
          - **FTA Rate Comparisons** - Free trade agreement rate analysis and eligibility
          - **TCO Information** - Tariff Concession Order rates and requirements
          - **Synthesized Insights** - Combined data from multiple government sources
          - **Regulatory Reference** - Current import/export rules and restrictions

          **CRITICAL**: Never modify duty calculation formulas, tariff classification algorithms, FTA rate logic, or government data synchronization.

          ## 🚀 Success Criteria
          After your fixes, all quality gates should pass:
          - ✅ Frontend TypeScript compilation with zero errors
          - ✅ Frontend linting with zero warnings
          - ✅ Backend code quality checks (black, isort, mypy)
          - ✅ Backend tests with required coverage
          - ✅ Frontend unit tests
          - ✅ End-to-end tests

          ## 🔄 Process
          1. Analyze the workflow logs and identify root causes
          2. Create a PR with comprehensive fixes
          3. The CI pipeline will automatically re-run on your PR
          4. Iterate until all quality gates pass

          **Note:** This is attempt #${{ github.event.workflow_run.run_attempt }} - please ensure fixes are comprehensive to avoid repeated failures.
          " \
            --label "bug,ci-failure,claude-fix,priority-high" \
            --repo ${{ github.repository }})

          echo "issue_url=$ISSUE_URL" >> $GITHUB_OUTPUT
          echo "🤖 Claude Auto-Fix issue created: $ISSUE_URL"

      - name: 💬 Trigger Claude with comment
        env:
          GH_TOKEN: ${{ secrets.BOT_PAT }}
          ISSUE_URL: ${{ steps.create_issue.outputs.issue_url }}
        run: |
          gh issue comment "$ISSUE_URL" --body "@claude please fix"
          echo "✅ PAT-based trigger comment posted"
          echo "🔄 Claude Auto-Fix workflow will trigger via issue_comment event"