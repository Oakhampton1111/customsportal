name: 🤖 Claude Auto-Fix

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  run:
    if: ${{ contains(github.event.comment.body, '@claude') }}
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🤖 Claude auto-fix
        uses: anthropics/claude-code-action@v0.0.21
        with:
          anthropic_api_key: ${{ secrets.CLAUDE_API_KEY }}